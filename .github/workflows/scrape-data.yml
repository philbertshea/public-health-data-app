name: Weekly Disease Data Sync

on:
  schedule:
    # Runs every Friday at 00:00 Singapore Time (which is Thursday 16:00 UTC)
    - cron: '0 16 * * 4'
  workflow_dispatch:
    # Allows you to manually trigger the pipeline anytime via the GitHub UI button

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the repository code into the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up the official Go environment runtime
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: backend/go.sum

    # 3. Run the Go pipeline script
    - name: Run Data Pipeline
      run: |
        cd backend
        go run .

    # 4. Commit and push the updated JSON file back to the repository
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Check if the weekly_infectious_bulletin_data.json file actually changed
        git add frontend/public/weekly_infectious_bulletin_data.json
        if git diff --staged --quiet; then
          echo "No new data changes detected this week."
        else
          git commit -m "Automated Sync: Update weekly infectious bulletin data"
          
          # 1. Pull down any recent updates you made while the runner was working
          git pull --rebase origin main
          
          # 2. Push the combined work safely back to GitHub
          git push origin main
        fi